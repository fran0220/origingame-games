  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>符文卡牌决斗</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #1b2028;
      --panel-2: #242b35;
      --line: #3a4350;
      --text: #f4f1e8;
      --muted: #aeb7c2;
      --gold: #f0bf57;
      --red: #e86f61;
      --blue: #5ca8e8;
      --green: #62c57b;
      --ink: #101215;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #30323a 0, #17191f 48%, #0f1114 100%);
      color: var(--text);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: stretch;
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .game {
      width: min(1180px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .topbar,
    .status,
    .hand,
    .actions {
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
    }

    .topbar {
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .scorebox {
      display: grid;
      grid-template-columns: repeat(3, minmax(72px, 1fr));
      gap: 8px;
      min-width: min(340px, 45vw);
    }

    .metric {
      min-height: 62px;
      padding: 9px 10px;
      border-radius: 7px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      font-size: 24px;
      line-height: 1;
      color: var(--gold);
    }

    .status {
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 48px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .message {
      font-size: 15px;
      line-height: 1.35;
      color: #e9edf2;
    }

    .rule {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .arena {
      min-height: 270px;
      display: grid;
      grid-template-columns: minmax(116px, 170px) minmax(0, 1fr) minmax(116px, 170px);
      gap: clamp(10px, 3vw, 28px);
      align-items: center;
    }

    .fighter {
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .avatar {
      width: min(30vw, 150px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 0 18%, transparent),
        linear-gradient(145deg, #3a4350, #15191f);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: grid;
      place-items: center;
      font-size: clamp(42px, 10vw, 78px);
      box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.05), 0 18px 45px rgba(0, 0, 0, 0.32);
    }

    .fighter h2 {
      margin: 0;
      font-size: 16px;
      color: var(--muted);
      font-weight: 650;
    }

    .wins {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .pip {
      height: 9px;
      border-radius: 999px;
      background: #2c333d;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pip.on {
      background: var(--gold);
      box-shadow: 0 0 14px rgba(240, 191, 87, 0.55);
    }

    .duel {
      display: grid;
      grid-template-columns: minmax(96px, 180px) minmax(54px, 86px) minmax(96px, 180px);
      gap: clamp(8px, 2vw, 18px);
      justify-content: center;
      align-items: center;
    }

    .versus {
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 900;
      font-size: clamp(20px, 4vw, 34px);
      text-shadow: 0 3px 16px rgba(240, 191, 87, 0.4);
    }

    .card {
      position: relative;
      min-width: 0;
      aspect-ratio: 3 / 4.25;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(160deg, #f5f0df, #cfc5a8);
      color: var(--ink);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      transform: translateZ(0);
    }

    .card.back {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0 8%, transparent 8% 16%, rgba(255, 255, 255, 0.12) 16% 24%, transparent 24% 32%),
        linear-gradient(160deg, #334150, #171d25);
      color: var(--text);
      border-color: #677080;
    }

    .card.back::after {
      content: "";
      position: absolute;
      inset: 16%;
      border: 2px solid rgba(240, 191, 87, 0.8);
      border-radius: 8px;
      box-shadow: inset 0 0 0 8px rgba(240, 191, 87, 0.1);
    }

    .card.fire {
      --accent: var(--red);
    }

    .card.water {
      --accent: var(--blue);
    }

    .card.leaf {
      --accent: var(--green);
    }

    .card .head {
      padding: 9px 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 8px;
      font-weight: 850;
    }

    .card .name {
      font-size: clamp(13px, 2vw, 18px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .card .power {
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent, var(--gold));
      color: #111;
      border: 2px solid rgba(0, 0, 0, 0.18);
      font-size: 20px;
      font-weight: 950;
    }

    .art {
      margin: 7px 9px;
      border-radius: 7px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.8), transparent 0 12%, transparent),
        linear-gradient(160deg, color-mix(in srgb, var(--accent, var(--gold)) 70%, #fff), color-mix(in srgb, var(--accent, var(--gold)) 35%, #222));
      display: grid;
      place-items: center;
      font-size: clamp(34px, 8vw, 70px);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.24);
    }

    .tag {
      margin: 0 10px 10px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(16, 18, 21, 0.13);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      min-height: 30px;
      display: grid;
      place-items: center;
    }

    .hand {
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .hand-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(88px, 1fr));
      gap: 10px;
    }

    .cards button.card {
      width: 100%;
      transition: transform 150ms ease, border-color 150ms ease, filter 150ms ease;
    }

    .cards button.card:disabled {
      cursor: default;
      filter: grayscale(0.25) brightness(0.74);
    }

    .cards button.card:not(:disabled):hover,
    .cards button.card:not(:disabled):focus-visible {
      transform: translateY(-7px);
      border-color: var(--gold);
      outline: 0;
    }

    .actions {
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .primary {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 7px;
      background: var(--gold);
      color: #17130a;
      font-weight: 850;
    }

    .primary:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .leaderboard {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .game {
        grid-template-rows: auto auto auto auto;
        gap: 10px;
      }

      .topbar,
      .status,
      .actions {
        grid-template-columns: 1fr;
      }

      .scorebox {
        min-width: 0;
        width: 100%;
      }

      .arena {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .fighter {
        display: none;
      }

      .duel {
        grid-template-columns: minmax(92px, 1fr) 44px minmax(92px, 1fr);
      }

      .cards {
        grid-template-columns: repeat(5, minmax(76px, 1fr));
        overflow-x: auto;
        padding-bottom: 4px;
        scroll-snap-type: x mandatory;
      }

      .cards button.card {
        min-width: 112px;
        scroll-snap-align: start;
      }
    }

    @media (max-width: 430px) {
      .scorebox {
        grid-template-columns: repeat(3, 1fr);
      }

      .metric {
        min-height: 54px;
        padding: 8px;
      }

      .metric strong {
        font-size: 20px;
      }

      .duel {
        grid-template-columns: minmax(82px, 1fr) 34px minmax(82px, 1fr);
      }

      .versus {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="符文卡牌决斗">
    <section class="topbar">
      <div>
        <h1>符文卡牌决斗</h1>
        <div class="subtitle">从手牌中选择一张出战。火克叶，叶克水，水克火；克制时 +2 点。</div>
      </div>
      <div class="scorebox" aria-label="比分">
        <div class="metric"><span>你的胜场</span><strong id="playerWins">0</strong></div>
        <div class="metric"><span>对手胜场</span><strong id="enemyWins">0</strong></div>
        <div class="metric"><span>本局分数</span><strong id="score">0</strong></div>
      </div>
    </section>

    <section class="status">
      <div class="message" id="message">选择一张手牌开始第一回合。</div>
      <div class="rule">先赢 5 回合获胜</div>
    </section>

    <section class="arena" aria-label="决斗区">
      <div class="fighter">
        <div class="avatar" aria-hidden="true">♜</div>
        <h2>你</h2>
        <div class="wins" id="playerPips" aria-label="你的胜场进度"></div>
      </div>
      <div class="duel">
        <article class="card back" id="playerCard" aria-label="你的出战牌"></article>
        <div class="versus">VS</div>
        <article class="card back" id="enemyCard" aria-label="对手出战牌"></article>
      </div>
      <div class="fighter">
        <div class="avatar" aria-hidden="true">☗</div>
        <h2>对手</h2>
        <div class="wins" id="enemyPips" aria-label="对手胜场进度"></div>
      </div>
    </section>

    <section class="hand">
      <div class="hand-title">
        <span>你的手牌</span>
        <span id="deckCount">牌库 0</span>
      </div>
      <div class="cards" id="hand"></div>
    </section>

    <section class="actions">
      <button class="primary" id="nextButton" disabled>下一回合</button>
      <button class="primary" id="newButton">重新开始</button>
      <div class="leaderboard" id="leaderboard">排行榜将在部署后启用</div>
    </section>
  </main>
